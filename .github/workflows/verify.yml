name: verify

# The plugin runs inside DeepSeek Harness, but its contract is testable without
# it: tools/smoke.mjs stubs the two host imports and stands a local HTTP server
# in for the ChatECNU gateway. No network, no API key, no DSH needed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tool contract tests (offline)
        run: node tools/smoke.mjs
      - name: Manifests parse and point at real files
        run: |
          node -e "
            const fs = require('node:fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const fail = (m) => { console.error('::error::' + m); process.exit(1); };
            if (pkg.name !== 'dsh-tool-ecnu-image') fail('package name changed');
            if (pkg.type !== 'module') fail('package must stay ESM');
            if (!pkg.dsh || !pkg.dsh.bundle || pkg.dsh.bundle.patch !== './cordis.patch.yml') fail('dsh.bundle.patch must point at ./cordis.patch.yml');
            for (const path of [pkg.main, pkg.exports['.'], pkg.dsh.bundle.patch, 'LICENSE', 'README.md']) {
              if (!path || !fs.existsSync(path)) fail('missing file referenced by package.json: ' + path);
            }
            const entry = fs.readFileSync(pkg.main, 'utf8');
            for (const name of ['image_generate', 'image_edit']) {
              if (!entry.includes("'" + name + "'")) fail('entry does not register ' + name);
            }
            console.log('manifest ok');
          "
      - name: The bundle patch must not carry a secret
        run: |
          if grep -nE 'sk-[A-Za-z0-9]{16,}' cordis.patch.yml README.md lib/index.js; then
            echo '::error::a credential value leaked into the repository'
            exit 1
          fi
